services:
  app:
    build: .
    image: prgram-helper:latest
    container_name: prgram
    restart: unless-stopped
    env_file: .env
    environment:
      WEB_PORT: "8787"
      PYTHONUNBUFFERED: "1"
    ports:
      - "${HOST_PORT:-8787}:8787"
    volumes:
      - ./data:/app/data
    # محدودیت منابع برای VPS کوچک (در صورت نیاز تغییر بده)
    mem_limit: ${MEM_LIMIT:-768m}
    cpus: ${CPU_LIMIT:-1.5}
    ulimits:
      nofile: 65535
    # چرخش لاگ داکر تا دیسک پر نشه
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    stop_grace_period: 20s
